[Unit]
# Start Plex after the media is mounted, so it never scans an empty folder.
Wants=encfs-media.service rclone-photos.service
After=encfs-media.service rclone-photos.service

[Service]
# Plex needs longer than the 90s default to checkpoint its SQLite DBs on stop;
# SIGKILL mid-checkpoint risks DB corruption (seen 2026-08-25 and 2026-08-29).
TimeoutStopSec=600
